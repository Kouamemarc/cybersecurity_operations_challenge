# Pipeline de démarrage — ingestion du dataset "Multi-source Security Logs"
# À ADAPTER au format réel du dataset (JSON, CSV, syslog...).
# Place les fichiers du dataset dans ./data/ (monté en lecture seule sur /data).

input {
  file {
    path => "/data/*.log"          # adapte l'extension au dataset
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_dataset"
    # codec => json                # décommente si le dataset est en JSON
  }
}

filter {
  # --- Normalisation minimale (à enrichir) ---
  # Exemple pour du syslog ; remplace par le grok adapté au dataset.
  # grok { match => { "message" => "%{SYSLOGLINE}" } }

  mutate {
    add_field => { "[event][dataset]" => "technovision.multisource" }
  }

  # Champ ECS de base
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
    tag_on_failure => ["_dateparsefailure"]
  }
}

output {
  elasticsearch {
    hosts    => ["${ELASTIC_HOSTS}"]
    user     => "${ELASTIC_USER}"
    password => "${ELASTIC_PASSWORD}"
    ssl_enabled => true
    ssl_certificate_authorities => "/usr/share/logstash/config/certs/ca/ca.crt"
    index    => "soc-multisource-%{+YYYY.MM.dd}"
  }
  # Décommente pour déboguer le parsing dans les logs du conteneur :
  # stdout { codec => rubydebug }
}
