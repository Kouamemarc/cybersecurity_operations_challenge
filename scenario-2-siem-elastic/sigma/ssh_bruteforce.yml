title: Bruteforce SSH - échecs d'authentification multiples
id: 8f2a1c40-1a2b-4c3d-9e5f-0a1b2c3d4e01
status: experimental
description: Détecte de multiples échecs d'authentification SSH depuis une même IP source, révélateur d'une attaque par force brute.
references:
  - https://attack.mitre.org/techniques/T1110/
author: Marc Bohoussou
date: 2026/09/21
tags:
  - attack.credential_access
  - attack.t1110
logsource:
  product: linux
  service: sshd
detection:
  selection:
    message|contains: 'Failed password'
  timeframe: 5m
  condition: selection | count() by src_ip > 5
falsepositives:
  - Utilisateur légitime saisissant plusieurs fois un mauvais mot de passe
  - Scanner de vulnérabilités interne autorisé
level: medium
