# =====================================================================
# TechnoVision — SOC · Scénario 2 (SIEM)
# Pipeline Logstash : ingestion + parsing + normalisation ECS des 6 sources
# Remplace 01-dataset.conf. Indexe dans : soc-<source>-AAAA.MM.jj
# =====================================================================

input {
  # --- Windows Security (JSON) ---
  file {
    path => "/data/windows_security.log"
    mode => "read"
    codec => "json"
    sincedb_path => "/usr/share/logstash/data/sincedb_win"
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/data/completed.log"
    add_field => { "[@metadata][source]" => "windows" }
  }
  # --- Sysmon (JSON) ---
  file {
    path => "/data/sysmon.log"
    mode => "read"
    codec => "json"
    sincedb_path => "/usr/share/logstash/data/sincedb_sysmon"
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/data/completed.log"
    add_field => { "[@metadata][source]" => "sysmon" }
  }
  # --- Linux auth (syslog) ---
  file {
    path => "/data/linux_auth.log"
    mode => "read"
    sincedb_path => "/usr/share/logstash/data/sincedb_linux"
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/data/completed.log"
    add_field => { "[@metadata][source]" => "linux" }
  }
  # --- Web access (combined) ---
  file {
    path => "/data/web_access.log"
    mode => "read"
    sincedb_path => "/usr/share/logstash/data/sincedb_web"
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/data/completed.log"
    add_field => { "[@metadata][source]" => "web" }
  }
  # --- Firewall pfSense (filterlog CSV) ---
  file {
    path => "/data/firewall.log"
    mode => "read"
    sincedb_path => "/usr/share/logstash/data/sincedb_fw"
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/data/completed.log"
    add_field => { "[@metadata][source]" => "firewall" }
  }
  # --- DNS dnsmasq (syslog) ---
  file {
    path => "/data/dns.log"
    mode => "read"
    sincedb_path => "/usr/share/logstash/data/sincedb_dns"
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/data/completed.log"
    add_field => { "[@metadata][source]" => "dns" }
  }
}

filter {

  # =========================== WINDOWS (JSON déjà parsé par le codec) ===========================
  if [@metadata][source] == "windows" {
    mutate { add_field => { "[event][dataset]" => "windows.security" } }
    # code -> action lisible + outcome
    if [event][code] == 4625 {
      mutate { add_field => { "[event][outcome]" => "failure" } }
    } else if [event][code] in [4624, 4688, 4720] {
      mutate { add_field => { "[event][outcome]" => "success" } }
    }
    # remonte l'IP source du logon en champ ECS
    if [winlog][event_data][IpAddress] {
      mutate { add_field => { "[source][ip]" => "%{[winlog][event_data][IpAddress]}" } }
    }
  }

  # =========================== SYSMON (JSON) ===========================
  else if [@metadata][source] == "sysmon" {
    mutate { add_field => { "[event][dataset]" => "windows.sysmon" } }
    # EventID 22 = requête DNS ; on normalise le nom demandé
    if [event][code] == 22 and [dns][question][name] {
      mutate { add_field => { "[dns][question][registered_domain]" => "%{[dns][question][name]}" } }
    }
  }

  # =========================== LINUX auth (syslog) ===========================
  else if [@metadata][source] == "linux" {
    grok {
      match => {
        "message" => [
          "%{SYSLOGTIMESTAMP:[event][ts]} %{HOSTNAME:[host][name]} sshd\[%{POSINT}\]: %{WORD:[event][action]} password for (invalid user )?%{USERNAME:[user][name]} from %{IP:[source][ip]} port %{POSINT:[source][port]:int} ssh2",
          "%{SYSLOGTIMESTAMP:[event][ts]} %{HOSTNAME:[host][name]} sudo: *%{USERNAME:[user][name]} : TTY=%{DATA} ; PWD=%{DATA} ; USER=%{USERNAME:[user][target]} ; COMMAND=%{GREEDYDATA:[process][command_line]}"
        ]
      }
      tag_on_failure => ["_grok_linux_fail"]
    }
    mutate { add_field => { "[event][dataset]" => "linux.auth" } }
    if [event][action] == "Failed"   { mutate { add_field => { "[event][outcome]" => "failure" } } }
    if [event][action] == "Accepted" { mutate { add_field => { "[event][outcome]" => "success" } } }
    date { match => ["[event][ts]", "MMM d HH:mm:ss", "MMM dd HH:mm:ss"] target => "@timestamp" }
  }

  # =========================== WEB (combined Apache/Nginx) ===========================
  else if [@metadata][source] == "web" {
    grok { match => { "message" => "%{COMBINEDAPACHELOG}" } tag_on_failure => ["_grok_web_fail"] }
    mutate {
      add_field => { "[event][dataset]" => "web.access" }
      rename => {
        "clientip" => "[source][ip]"
        "verb"     => "[http][request][method]"
        "request"  => "[url][path]"
        "response" => "[http][response][status_code]"
        "bytes"    => "[http][response][body][bytes]"
        "agent"    => "[user_agent][original]"
      }
    }
    date { match => ["timestamp", "dd/MMM/yyyy:HH:mm:ss Z"] target => "@timestamp" }
    # marqueur d'outil offensif dans le User-Agent
    if [user_agent][original] =~ /(?i)(sqlmap|nikto|nmap|curl|dirb|gobuster)/ {
      mutate { add_field => { "[rule][name]" => "suspicious_user_agent" } }
    }
  }

  # =========================== FIREWALL pfSense (filterlog CSV) ===========================
  else if [@metadata][source] == "firewall" {
    grok {
      match => { "message" => "%{SYSLOGTIMESTAMP:[event][ts]} %{HOSTNAME:[observer][hostname]} filterlog\[%{POSINT}\]: %{GREEDYDATA:fw_csv}" }
      tag_on_failure => ["_grok_fw_fail"]
    }
    csv {
      source => "fw_csv"
      columns => ["fw_rule","fw_subrule","fw_anchor","fw_tracker","[observer][ingress][interface][name]",
                  "fw_reason","[event][action]","[network][direction]","fw_ipver","fw_tos","fw_ecn",
                  "fw_ttl","fw_id","fw_offset","fw_ipflags","fw_protonum","[network][transport]",
                  "fw_length","[source][ip]","[destination][ip]","[source][port]","[destination][port]"]
    }
    mutate {
      add_field => { "[event][dataset]" => "network.firewall" }
      convert => { "[source][port]" => "integer" "[destination][port]" => "integer" }
      remove_field => ["fw_csv","fw_subrule","fw_anchor","fw_tos","fw_ecn","fw_offset","fw_ipflags"]
    }
    date { match => ["[event][ts]", "MMM d HH:mm:ss", "MMM dd HH:mm:ss"] target => "@timestamp" }
  }

  # =========================== DNS dnsmasq (syslog) ===========================
  else if [@metadata][source] == "dns" {
    grok {
      match => { "message" => "%{SYSLOGTIMESTAMP:[event][ts]} %{HOSTNAME:[host][name]} dnsmasq\[%{POSINT}\]: query\[%{WORD:[dns][question][type]}\] %{NOTSPACE:[dns][question][name]} from %{IP:[source][ip]}" }
      tag_on_failure => ["_grok_dns_fail"]
    }
    mutate { add_field => { "[event][dataset]" => "network.dns" } }
    date { match => ["[event][ts]", "MMM d HH:mm:ss", "MMM dd HH:mm:ss"] target => "@timestamp" }
    # longueur du domaine (utile pour détecter le tunneling DNS = sous-domaines longs)
    if [dns][question][name] {
      ruby { code => "event.set('[dns][question][name_length]', event.get('[dns][question][name]').to_s.length)" }
    }
  }

  # nettoyage commun
  mutate { remove_field => ["event.ts", "[event][ts]", "host_fw", "ident", "auth", "httpversion"] }
}

output {
  elasticsearch {
    hosts       => ["${ELASTIC_HOSTS}"]
    user        => "${ELASTIC_USER}"
    password    => "${ELASTIC_PASSWORD}"
    ssl_enabled => true
    ssl_certificate_authorities => "/usr/share/logstash/config/certs/ca/ca.crt"
    index       => "soc-%{[@metadata][source]}-%{+YYYY.MM.dd}"
  }
  # Décommente pour déboguer le parsing dans les logs du conteneur :
  # stdout { codec => rubydebug }
}
